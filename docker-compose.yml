services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carepocket-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: ["pnpm", "exec", "ng", "serve", "--host", "0.0.0.0", "--poll", "2000"]
