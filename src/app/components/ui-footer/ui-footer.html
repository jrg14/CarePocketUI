<footer class="border-t border-base-200 bg-base-100">
  <div class="mx-auto grid w-full max-w-7xl gap-10 px-4 py-10 sm:px-6 lg:grid-cols-[1.5fr_1fr_1fr] lg:px-8">
    <div class="space-y-3">
      <div class="text-xl font-bold tracking-tight text-primary">{{ brand }}</div>
      <p class="max-w-md text-sm leading-6 text-base-content/70">
        {{ description }}
      </p>
    </div>

    <div>
      <h3 class="footer-title">Enlaces</h3>
      <div class="flex flex-col gap-2">
        @for (link of links; track link.href) {
          <a
            class="link link-hover"
            [attr.href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noreferrer noopener' : null"
          >
            {{ link.label }}
          </a>
        }
      </div>
    </div>

    <div>
      <h3 class="footer-title">Redes</h3>
      <div class="flex flex-col gap-2">
        @for (link of socialLinks; track link.href) {
          <a
            class="link link-hover"
            [attr.href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noreferrer noopener' : null"
          >
            {{ link.label }}
          </a>
        }
      </div>
    </div>
  </div>

  <div class="border-t border-base-200">
    <div class="mx-auto flex w-full max-w-7xl flex-col gap-2 px-4 py-4 text-sm text-base-content/60 sm:px-6 lg:px-8">
      <p>© {{ currentYear }} {{ brand }}. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>
