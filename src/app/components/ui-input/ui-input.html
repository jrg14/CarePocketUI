<label class="form-control" [class.w-full]="fullWidth">
  @if (label) {
    <div class="label">
      <span class="label-text">
        {{ label }}
        @if (required) {
          <span class="text-error">*</span>
        }
      </span>
    </div>
  }

  <input
    [class]="inputClasses"
    [id]="inputId"
    [name]="name"
    [type]="type"
    [value]="value"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [attr.inputmode]="inputMode || null"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    [attr.maxlength]="maxLength"
    [required]="required"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  @if (helperText || errorText) {
    <div class="label">
      <span class="label-text-alt" [class.text-error]="!!errorText">
        {{ errorText || helperText }}
      </span>
    </div>
  }
</label>
