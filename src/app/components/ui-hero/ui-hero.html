<section
  [ngClass]="heroClasses"
  [style.background-image]="imageSrc ? heroStyle['backgroundImage'] : null"
>
  @if (imageSrc) {
    <div [ngClass]="['hero-overlay', imageOverlayClass]"></div>
  } @else {
    <div class="hero-overlay bg-base-300/60"></div>
  }

  <div [ngClass]="contentClasses">
    <div [ngClass]="contentGridClasses">
      <div class="space-y-6" [class.mx-auto]="centered">
        @if (eyebrow) {
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">
            {{ eyebrow }}
          </p>
        }

        <div class="space-y-4">
          <h1 class="max-w-2xl text-4xl font-bold tracking-tight sm:text-5xl lg:text-6xl">
            {{ title }}
          </h1>
          <p class="max-w-xl text-base leading-7 sm:text-lg">
            {{ description }}
          </p>
        </div>

        <div class="flex flex-wrap gap-3" [class.justify-center]="centered">
          @if (primaryBtnText) {
            <app-ui-button (onClick)="onPrimaryAction.emit()">
              {{ primaryBtnText }}
            </app-ui-button>
          }

          @if (secondaryBtnText) {
            <app-ui-button variant="ghost" (onClick)="onSecondaryAction.emit()">
              {{ secondaryBtnText }}
            </app-ui-button>
          }
        </div>

        @if (highlights.length) {
          <div class="flex flex-wrap gap-2" [class.justify-center]="centered">
            @for (highlight of highlights; track highlight) {
              <span class="badge badge-neutral badge-outline">{{ highlight }}</span>
            }
          </div>
        }
      </div>
    </div>
  </div>
</section>
