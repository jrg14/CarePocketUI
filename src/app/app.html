<div class="flex min-h-screen flex-col bg-base-200 text-base-content">
  <app-ui-navbar
    brand="CarePocket"
    [brandHref]="brandHref()"
    [links]="navLinks()"
    [ctaLabel]="loginCtaLabel()"
    [ctaHref]="loginCtaHref()"
    [secondaryCtaLabel]="secondaryCtaLabel()"
    [secondaryCtaHref]="secondaryCtaHref()"
    [authUser]="authUser()"
    [authBusy]="authBusy()"
    (logout)="logout()"
  ></app-ui-navbar>

  <main class="mx-auto w-full flex-1 max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>

  @if (showFooter()) {
    <app-ui-footer
      brand="CarePocket"
      description="Analítica financiera personal para entender hábitos, anticipar escenarios y tomar mejores decisiones."
      [links]="footerLinks"
      [socialLinks]="socialLinks"
    ></app-ui-footer>
  }
</div>
