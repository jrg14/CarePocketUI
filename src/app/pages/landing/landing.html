<div class="space-y-40 pb-10">
  <app-ui-hero
    eyebrow="CarePocket"
    title="Tu analista financiero personal"
    description="CarePocket le da sentido a tu dinero. Te explica sin rodeos por qué cambian tus finanzas, te muestra qué pasará con tus gastos en el futuro y te dice exactamente qué hacer hoy para mejorar tu economía."
    primaryBtnText="Explorar el análisis"
    secondaryBtnText="Probar simulación"
    [highlights]="[
      'Detecta patrones invisibles',
      'Anticipa escenarios financieros',
      'Recomienda decisiones sobre tus finanzas',
    ]"
    (onPrimaryAction)="scrollTo('analisis')"
    (onSecondaryAction)="scrollTo('simulacion')"
  />

  <app-ui-section
    id="problema"
    eyebrow="La pregunta correcta"
    title="El problema real es que no basta con saber cuánto gastaste"
    description="Otras apps solo te muestran el pasado. CarePocket analiza tus números para darte respuestas claras y ayudarte a tomar mejores decisiones hoy."
  >
    <div class="grid gap-6 md:grid-cols-3">
      @for (card of questionCards; track card.title) {
        <app-ui-card [title]="card.title" [description]="card.description" [hoverable]="false">
        </app-ui-card>
      }
    </div>
  </app-ui-section>

  <app-ui-section
    id="analisis"
    eyebrow="Motor de análisis"
    title="Convierte transacciones en inteligencia financiera"
    description="La plataforma busca patrones, identifica riesgos y presenta recomendaciones personalizadas para ayudar a entender el presente y anticipar el futuro."
  >
    <div class="grid gap-6 md:grid-cols-3">
      @for (card of insightCards; track card.title) {
        <app-ui-card [badge]="card.badge" [title]="card.title" [description]="card.description">
        </app-ui-card>
      }
    </div>
  </app-ui-section>
</div>
